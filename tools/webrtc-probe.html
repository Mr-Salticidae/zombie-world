<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>热点联机可行性探针</title>
<style>
  :root{ --bg:#12151b; --card:#1b202a; --line:#2b3340; --fg:#e6ebf2; --dim:#8d99ab;
         --ok:#79e39f; --bad:#ff7a7a; --warn:#ffcb55; --key:#79d7ff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; padding:14px; background:var(--bg); color:var(--fg);
        font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
        display:flex; flex-direction:column; gap:12px; max-width:560px; margin-inline:auto; }
  h1{ font-size:18px; margin:0; }
  .sub{ color:var(--dim); font-size:13px; margin:-8px 0 0; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px;
         padding:12px; display:flex; flex-direction:column; gap:8px; }
  .card h2{ font-size:12px; margin:0; color:var(--dim); font-weight:600; letter-spacing:.08em; }
  button{ font:inherit; font-weight:600; color:#0d1016; background:var(--key); border:0;
          border-radius:8px; padding:13px 14px; width:100%; }
  button.ghost{ background:#2b3340; color:var(--fg); }
  button:disabled{ opacity:.4; }
  :focus-visible{ outline:2px solid var(--key); outline-offset:2px; }
  textarea{ width:100%; height:88px; background:#0d1016; color:var(--fg); border:1px solid var(--line);
            border-radius:8px; padding:10px; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;
            resize:vertical; }
  label.chk{ display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; }
  label.chk input{ width:18px; height:18px; }
  #state{ font-size:20px; font-weight:700; text-align:center; padding:8px 0; }
  .hint{ color:var(--dim); font-size:12px; margin:0; }
  table{ width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  td{ padding:5px 0; vertical-align:top; }
  td:first-child{ color:var(--dim); width:38%; }
  #log{ font:11px/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--dim);
        max-height:210px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .ok{ color:var(--ok); } .bad{ color:var(--bad); } .warn{ color:var(--warn); } .key{ color:var(--key); }
  .hidden{ display:none; }
</style>
</head>
<body>

<h1>热点联机可行性探针</h1>
<div class="sub">两台手机连同一个热点，验证 WebRTC 能不能直接连上，以及走的是哪条线路。</div>

<div class="card" id="cardSelf">
  <h2>第一步 · 单机自检（一台手机就够）</h2>
  <button id="btnSelf">开始自检</button>
  <div class="hint" id="selfVerdict">不用第二台手机、不用开热点。这一步只问两件事：这个容器有没有 WebRTC，
    以及拿不拿得到局域网候选。这两关过不去，跨设备就不用试了。</div>
</div>

<div class="card" id="cardRole">
  <h2>第二步 · 跨设备实测（要两台手机连同一热点）</h2>
  <button id="btnHost">我是房主（先出码）</button>
  <button class="ghost" id="btnGuest">我是客机（先收码）</button>
</div>

<!-- 这张卡不随角色隐藏：客机是在粘码那一刻才建连接的，开关藏起来就没法在第二轮改了 -->
<div class="card" id="cardMode">
  <h2>线路模式</h2>
  <label class="chk">
    <input type="checkbox" id="useStun">
    <span>加公共 STUN（默认关闭 = 纯局域网直连）</span>
  </label>
  <div class="hint">先用默认的纯局域网跑一次；连不上再勾 STUN 重来一次，两次结果合起来才说明问题。
    <b>两台手机必须选一样的模式</b>，否则测出来的东西没有意义。</div>
</div>

<div class="card hidden" id="cardOut">
  <h2><span id="outTitle">我的码</span></h2>
  <textarea id="outBox" readonly placeholder="正在收集网络候选…"></textarea>
  <div class="hint" id="outSize"></div>
  <button id="btnCopy">复制，发给对方</button>
</div>

<div class="card hidden" id="cardIn">
  <h2><span id="inTitle">粘贴对方的码</span></h2>
  <textarea id="inBox" placeholder="把对方发来的一长串粘在这里"></textarea>
  <button id="btnApply">确定</button>
</div>

<div class="card">
  <h2>结果</h2>
  <div id="state" class="warn">未开始</div>
  <table>
    <tr><td>连线方式</td><td id="rPath">—</td></tr>
    <tr><td>本地候选</td><td id="rLocal">—</td></tr>
    <tr><td>对端候选</td><td id="rRemote">—</td></tr>
    <tr><td>往返延迟</td><td id="rRtt">—</td></tr>
  </table>
</div>

<div class="card">
  <h2>诊断日志</h2>
  <div id="log"></div>
  <button class="ghost" id="btnReport">复制完整诊断报告</button>
</div>

<script>
/* 这是一次性诊断页，不是游戏的一部分。它只回答一件事：
   在两台手机连同一个热点时，浏览器/WebView 里的 WebRTC 到底能不能点对点连上，
   以及最终选中的是哪种候选（host = 真局域网直连，srflx = 绕了公网回来，relay = 要中转服务器）。
   信令故意用最笨的复制粘贴（走微信发给对方），因为这一版要测的是网络能力，
   不是扫码体验——少一个变量，失败时就少一个甩锅对象。 */

const $ = id => document.getElementById(id);
const T0 = Date.now();
const logLines = [];

function log(msg, cls){
  const t = ((Date.now() - T0) / 1000).toFixed(2).padStart(6, ' ');
  logLines.push(t + 's  ' + msg);
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = t + 's  ' + msg;
  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
}

function setState(text, cls){
  $('state').textContent = text;
  $('state').className = cls || '';
}

/* ---------- base64（UTF-8 安全，微信转发不会吃掉字符） ---------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(String(b64).replace(/\s+/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* ---------- 顺手量一下 SDP 精简后有多大 ----------
   下一版要把码换成二维码，能不能换取决于这个数：标准二维码在手机上能稳拍到的
   大约是 300~500 字节，再多就要密到拍不清。这里只统计不重建，先把账算明白。 */
function essentialSdp(sdp){
  const keep = [];
  for (const line of sdp.split(/\r?\n/)){
    if (/^a=(ice-ufrag|ice-pwd|fingerprint|setup):/.test(line)) keep.push(line.replace(/^a=/, ''));
    else if (/^a=candidate:/.test(line) && / udp /i.test(line)) keep.push(line.replace(/^a=candidate:/, 'c='));
  }
  return keep.join('|');
}
function reportSize(sdp){
  const raw = new TextEncoder().encode(sdp).length;
  const min = new TextEncoder().encode(essentialSdp(sdp)).length;
  const verdict = min <= 500 ? '二维码可行' : min <= 900 ? '二维码勉强（需再压缩）' : '二维码不可行';
  $('outSize').textContent = `原始 ${raw} 字节 → 精简 ${min} 字节 · ${verdict}`;
  log(`SDP 原始 ${raw} 字节，精简后 ${min} 字节 —— ${verdict}`, min <= 500 ? 'ok' : 'warn');
}

/* ---------- 连接 ---------- */
let pc = null, dc = null, isHost = false, statsTimer = null, pingTimer = null, pingSeq = 0;
const rtts = [];

// 国内可用的公共 STUN；只有勾了开关才用。谷歌那台在国内基本连不上，不放。
const STUN = [{ urls: 'stun:stun.miwifi.com:3478' }, { urls: 'stun:stun.qq.com:3478' }];

function createPeer(){
  const useStun = $('useStun').checked;
  $('useStun').disabled = true;   // 连接一旦建起来，模式就定死了，别让它中途变化误导日志
  pc = new RTCPeerConnection({ iceServers: useStun ? STUN : [] });
  log(useStun ? '模式：局域网 + 公共 STUN' : '模式：纯局域网（不配任何 iceServer）', 'key');

  pc.onicecandidate = e => {
    if (!e.candidate){ log('候选收集完毕'); return; }
    const c = e.candidate;
    const mdns = /\.local/i.test(c.address || c.candidate) ? '  ← mDNS 域名' : '';
    log(`候选 ${c.type || '?'} ${c.protocol || ''} ${c.address || ''}${mdns}`);
  };
  pc.onicecandidateerror = e => {
    // STUN 连不上会走这里；纯局域网模式下不该出现
    log(`候选出错 ${e.errorCode} ${e.errorText || ''} (${e.url || ''})`, 'warn');
  };
  pc.onicegatheringstatechange = () => log('gathering: ' + pc.iceGatheringState);
  pc.oniceconnectionstatechange = () => {
    log('ice: ' + pc.iceConnectionState, pc.iceConnectionState === 'failed' ? 'bad' : '');
    if (pc.iceConnectionState === 'failed'){
      setState('连接失败', 'bad');
      log('ICE 失败 —— 这一档没打通，去勾 STUN 再跑一次对比', 'bad');
    }
  };
  pc.onconnectionstatechange = () => log('conn: ' + pc.connectionState);
  return pc;
}

function wireChannel(channel){
  dc = channel;
  dc.onopen = () => {
    setState('已连接', 'ok');
    log('数据通道打开', 'ok');
    startPing();
    pollStats();
    statsTimer = setInterval(pollStats, 2000);
  };
  dc.onclose = () => { setState('通道已关闭', 'bad'); log('数据通道关闭', 'bad'); stopTimers(); };
  dc.onerror = e => log('通道错误 ' + (e.error && e.error.message || ''), 'bad');
  dc.onmessage = e => {
    const msg = String(e.data);
    if (msg.startsWith('PING:')) { dc.send('PONG:' + msg.slice(5)); return; }
    if (msg.startsWith('PONG:')){
      const sent = Number(msg.slice(5).split(':')[1]);
      const rtt = performance.now() - sent;
      rtts.push(rtt);
      const avg = rtts.reduce((a, b) => a + b, 0) / rtts.length;
      $('rRtt').innerHTML = `<span class="ok">${rtt.toFixed(0)} ms</span> · 平均 ${avg.toFixed(0)} ms`
                          + ` · 最小 ${Math.min(...rtts).toFixed(0)} · 最大 ${Math.max(...rtts).toFixed(0)}`
                          + ` · 已收 ${rtts.length}/${pingSeq}`;
    }
  };
}

function startPing(){
  pingTimer = setInterval(() => {
    if (!dc || dc.readyState !== 'open') return;
    dc.send(`PING:${++pingSeq}:${performance.now()}`);
  }, 1000);
}
function stopTimers(){
  clearInterval(statsTimer); clearInterval(pingTimer);
  statsTimer = pingTimer = null;
}

/* 这是整个探针真正要的答案：选中的候选对是哪一种。
   host ↔ host  = 两台手机在热点内直连，方案成立
   srflx        = 绕到公网又拐回来，能用但依赖运营商 NAT 行为
   relay        = 必须有中转服务器，等于方案不成立 */
async function pollStats(){
  if (!pc) return;
  const stats = await pc.getStats();
  let pair = null;
  stats.forEach(r => {
    if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) pair = r;
  });
  if (!pair){
    stats.forEach(r => {
      if (r.type === 'transport' && r.selectedCandidatePairId) pair = stats.get(r.selectedCandidatePairId);
    });
  }
  if (!pair) return;

  const local = stats.get(pair.localCandidateId);
  const remote = stats.get(pair.remoteCandidateId);
  const fmt = c => c ? `${c.candidateType || '?'} ${c.protocol || ''} ${c.address || c.ip || ''}:${c.port || ''}` : '—';
  $('rLocal').textContent = fmt(local);
  $('rRemote').textContent = fmt(remote);

  const type = local && local.candidateType;
  const verdict =
    type === 'host'  ? ['<span class="ok">host ↔ host · 热点内直连，方案成立</span>', 'ok'] :
    type === 'srflx' || type === 'prflx' ? ['<span class="warn">经公网反射（srflx）· 能连但依赖 NAT 行为</span>', 'warn'] :
    type === 'relay' ? ['<span class="bad">relay · 必须中转服务器，方案不成立</span>', 'bad'] :
                       [String(type || '—'), ''];
  if ($('rPath').dataset.v !== String(type)){
    $('rPath').dataset.v = String(type);
    $('rPath').innerHTML = verdict[0];
    log('选中候选对：' + fmt(local) + '  ↔  ' + fmt(remote), verdict[1]);
  }
  if (pair.currentRoundTripTime != null){
    log('ICE 层 RTT ' + (pair.currentRoundTripTime * 1000).toFixed(0) + ' ms');
  }
}

/* ---------- 单机自检：本机两个 PeerConnection 自己连自己 ----------
   跨设备实测要两台手机、一个热点、一个配合的人，成本高。但整条路上最先该被否掉的两件事
   在一台机器上就能问出来：
     1. 这个容器里到底有没有 WebRTC（B站 WebView 可能直接把它关了）
     2. 拿不拿得到 host 候选（拿不到 = 局域网直连没有原料，跨设备必挂）
   自检通过不代表跨设备一定能连（同机 loopback 不经过网络），但自检不过就一定连不上，
   所以它是一道零成本的过滤，先跑它。 */
async function selfCheck(){
  $('btnSelf').disabled = true;
  log('—— 单机自检开始 ——', 'key');

  if (typeof RTCPeerConnection === 'undefined'){
    selfVerdict('这个容器没有 WebRTC，方案到此为止', 'bad');
    return;
  }

  const a = new RTCPeerConnection({ iceServers: [] });
  const b = new RTCPeerConnection({ iceServers: [] });
  const seen = [];
  const bury = () => { try { a.close(); b.close(); } catch (_) {} };

  a.onicecandidate = e => { if (e.candidate){ seen.push(e.candidate); b.addIceCandidate(e.candidate).catch(() => {}); } };
  b.onicecandidate = e => { if (e.candidate){ seen.push(e.candidate); a.addIceCandidate(e.candidate).catch(() => {}); } };

  const opened = new Promise(resolve => {
    const ch = a.createDataChannel('selftest');
    ch.onopen = () => { ch.send('hi'); resolve(true); };
    b.ondatachannel = e => { e.channel.onmessage = () => {}; };
    setTimeout(() => resolve(false), 8000);
  });

  try {
    await a.setLocalDescription(await a.createOffer());
    await b.setRemoteDescription(a.localDescription);
    await b.setLocalDescription(await b.createAnswer());
    await a.setRemoteDescription(b.localDescription);
  } catch (err){
    log('自检握手失败：' + (err.message || err), 'bad');
    selfVerdict('WebRTC 存在但握不上手，方案基本没戏', 'bad');
    bury();
    return;
  }

  const ok = await opened;

  const hosts = seen.filter(c => c.type === 'host');
  const mdns  = hosts.filter(c => /\.local/i.test(c.address || c.candidate || ''));
  const real  = hosts.length - mdns.length;
  log(`候选合计 ${seen.length}：host ${hosts.length}（其中 mDNS 域名 ${mdns.length}、真实 IP ${real}）`);
  for (const c of hosts) log('  host → ' + (c.address || c.candidate));

  if (!ok){
    selfVerdict('数据通道没能打开——这个容器很可能阉割了 WebRTC', 'bad');
  } else if (!hosts.length){
    selfVerdict('通道能开，但一个 host 候选都拿不到：局域网直连没有原料，跨设备大概率失败', 'bad');
  } else if (mdns.length && !real){
    selfVerdict(`通道正常，host 候选 ${hosts.length} 个但全是 mDNS 域名——`
              + '能不能用取决于对端解析得了 .local，必须跨设备实测', 'warn');
  } else {
    selfVerdict(`通道正常，拿到 ${real} 个真实局域网 IP 候选——原料齐了，可以去做跨设备实测`, 'ok');
  }
  bury();
}

function selfVerdict(text, cls){
  $('selfVerdict').textContent = text;
  $('selfVerdict').className = 'hint ' + cls;
  log('自检结论：' + text, cls);
}

/* 不用 trickle：等候选收齐（或超时）再一次性出码，这样一来一回两条码就够了 */
function waitForGathering(timeoutMs){
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    const done = () => { clearTimeout(timer); pc.removeEventListener('icegatheringstatechange', check); resolve(); };
    const check = () => { if (pc.iceGatheringState === 'complete') done(); };
    const timer = setTimeout(() => { log('候选收集超时，用已有的先发', 'warn'); done(); }, timeoutMs);
    pc.addEventListener('icegatheringstatechange', check);
  });
}

async function publishLocal(kind){
  await waitForGathering($('useStun').checked ? 6000 : 3000);
  const sdp = pc.localDescription.sdp;
  reportSize(sdp);
  $('outBox').value = b64enc(JSON.stringify({ t: kind, sdp }));
  log(kind === 'offer' ? '邀请码已生成，发给对方' : '应答码已生成，发回给房主', 'key');
}

async function startHost(){
  isHost = true;
  $('cardRole').classList.add('hidden');
  $('cardOut').classList.remove('hidden');
  $('outTitle').textContent = '① 我的邀请码 —— 发给对方';
  $('inTitle').textContent = '② 粘贴对方发回的应答码';
  setState('正在收集候选…', 'warn');
  createPeer();
  wireChannel(pc.createDataChannel('probe', { ordered: true }));
  await pc.setLocalDescription(await pc.createOffer());
  await publishLocal('offer');
  $('cardIn').classList.remove('hidden');
  setState('等对方的应答码', 'warn');
}

function startGuest(){
  $('cardRole').classList.add('hidden');
  $('cardIn').classList.remove('hidden');
  $('inTitle').textContent = '① 粘贴房主发来的邀请码';
  $('outTitle').textContent = '② 我的应答码 —— 发回给房主';
  setState('等房主的邀请码', 'warn');
}

async function applyRemote(){
  let payload;
  try { payload = JSON.parse(b64dec($('inBox').value)); }
  catch (_) { log('这串码读不出来，八成是复制时漏了一截', 'bad'); setState('码不完整', 'bad'); return; }

  $('btnApply').disabled = true;
  try {
    if (payload.t === 'offer'){
      if (isHost) throw new Error('房主不该收邀请码——对方也点了房主？让一个人改成客机');
      createPeer();
      pc.ondatachannel = e => wireChannel(e.channel);
      await pc.setRemoteDescription({ type: 'offer', sdp: payload.sdp });
      log('已读入邀请码，开始生成应答');
      setState('正在收集候选…', 'warn');
      await pc.setLocalDescription(await pc.createAnswer());
      $('cardOut').classList.remove('hidden');
      await publishLocal('answer');
      setState('把应答码发回去，等对方粘贴', 'warn');
    } else if (payload.t === 'answer'){
      if (!pc) throw new Error('还没生成邀请码就收到了应答码——先点「我是房主」');
      await pc.setRemoteDescription({ type: 'answer', sdp: payload.sdp });
      log('已读入应答码，开始打洞');
      setState('连接中…', 'warn');
    } else {
      throw new Error('码的类型不认识：' + payload.t);
    }
  } catch (err){
    log(err.message || String(err), 'bad');
    setState('这一步没走通', 'bad');
    $('btnApply').disabled = false;
  }
}

/* ---------- 复制：execCommand 兜底，WebView 里 clipboard API 常被拦 ---------- */
async function copyText(text, okMsg){
  try { await navigator.clipboard.writeText(text); log(okMsg, 'ok'); return; }
  catch (_) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  log(ok ? okMsg + '（走的兜底通道）' : '复制被拦了，请手动长按选中文本框', ok ? 'ok' : 'bad');
}

$('btnSelf').onclick = selfCheck;
$('btnHost').onclick = startHost;
$('btnGuest').onclick = startGuest;
$('btnApply').onclick = applyRemote;
$('btnCopy').onclick = () => copyText($('outBox').value, '已复制，发给对方');
$('btnReport').onclick = () => {
  const head = [
    '=== 热点联机探针报告 ===',
    '自检: ' + $('selfVerdict').textContent.trim(),
    '角色: ' + (isHost ? '房主' : '客机'),
    'STUN: ' + ($('useStun').checked ? '开' : '关'),
    '连线方式: ' + $('rPath').textContent,
    '本地候选: ' + $('rLocal').textContent,
    '对端候选: ' + $('rRemote').textContent,
    '延迟: ' + $('rRtt').textContent,
    'UA: ' + navigator.userAgent,
    '安全上下文: ' + window.isSecureContext,
    '页面地址: ' + location.href,
    '--- 日志 ---',
  ].join('\n');
  copyText(head + '\n' + logLines.join('\n'), '报告已复制，发给开发');
};

log('UA: ' + navigator.userAgent);
log('安全上下文 isSecureContext = ' + window.isSecureContext, window.isSecureContext ? 'ok' : 'bad');
if (!window.isSecureContext){
  setState('当前页面不是 HTTPS', 'bad');
  log('WebRTC 只在安全上下文里工作，这个地址测不了，换 https 打开', 'bad');
}
if (typeof RTCPeerConnection === 'undefined'){
  setState('这个环境没有 WebRTC', 'bad');
  log('RTCPeerConnection 不存在 —— 容器直接禁掉了 WebRTC，方案到此为止', 'bad');
  $('btnHost').disabled = $('btnGuest').disabled = true;
}
</script>
</body>
</html>
